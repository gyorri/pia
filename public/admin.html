<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>아카이브 테스트 관리자</title><link rel="stylesheet" href="/style.css"></head><body><div class="admin"><h1>아카이브 테스트 관리자</h1><p><a href="/">← 타임라인 보기</a></p><p style="color:#ffbc77">테스트 버전: 로그인 기능 없음. 이 브라우저에만 저장되며 다른 사용자와 공유되지 않습니다. 공개 배포 시 민감한 정보를 입력하지 마세요.</p><h2>계정 추가</h2><form id="accountForm"><label>닉네임<input name="name" required maxlength="100"></label><label>아이디 (@ 제외)<input name="handle" required pattern="[A-Za-z0-9_]{1,30}" title="영문, 숫자, 밑줄만"></label><label>소개<input name="bio" maxlength="500"></label><label>프로필 사진 URL (선택)<input name="avatar" type="url"></label><button>계정 저장</button></form><h2>게시물/답글 추가</h2><form id="postForm"><label>작성자<select name="account_id" id="accounts" required></select></label><label>답글 대상 게시물 (선택)<select name="parent_id" id="parents"></select></label><label>작성 일시 (한국시간)<input name="posted_at" type="datetime-local" required></label><label>본문<textarea name="content" rows="6" required></textarea></label><button>게시물 저장</button></form><h2>데이터 관리</h2><p class="small">테스트 데이터를 JSON으로 백업하거나 복원할 수 있습니다.</p><button id="export">JSON 내보내기</button> <label style="display:inline-block">JSON 가져오기<input type="file" id="import" accept="application/json,.json"></label><p><button id="reset" class="danger">테스트 데이터 초기화</button></p></div><script src="/admin.js"></script></body></html>
