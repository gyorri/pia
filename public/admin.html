<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 · 타임라인</title><link rel="stylesheet" href="/style.css?v=2"></head><body><div class="admin"><h1>타임라인 관리자</h1><p><a href="/">← 타임라인</a></p><section id="loginBox"><h2>관리자 로그인</h2><form id="login"><label>관리자 비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form></section><section id="workspace" hidden><button id="logout">로그아웃</button><h2>계정 등록 / 수정</h2><form id="accountForm"><input name="id" type="hidden"><label>닉네임<input name="name" required maxlength="100"></label><label>아이디 (@ 제외)<input name="handle" required pattern="[A-Za-z0-9_]{1,30}"></label><label>소개<input name="bio" maxlength="500"></label><label>프로필 사진 URL<input name="avatar" type="url"></label><button>계정 저장</button> <button type="reset">새 계정</button></form><div id="accountList"></div><h2>게시물 / 답글 등록 · 수정</h2><form id="postForm"><input name="id" type="hidden"><label>작성 계정<select name="account_id" id="accounts" required></select></label><label>답글 대상 게시물<select name="parent_id" id="parents"></select></label><label>원본 작성 날짜·시간<input name="posted_at" type="datetime-local" step="1" required></label><label>원본 시간대<select name="offset"><option value="+09:00">한국 / 일본 (+09:00)</option><option value="+00:00">UTC (+00:00)</option><option value="-04:00">미국 동부 서머타임 (-04:00)</option><option value="-05:00">미국 동부 표준시 (-05:00)</option><option value="-07:00">미국 서부 서머타임 (-07:00)</option><option value="-08:00">미국 서부 표준시 (-08:00)</option><option value="+08:00">중국 (+08:00)</option></select></label><label>본문<textarea name="content" rows="7" required></textarea></label><button>게시물 저장</button> <button type="reset">새 게시물</button></form><div id="postList"></div><h2>백업</h2><button id="export">JSON 내보내기</button></section><p id="status" role="status"></p></div><script src="/admin.js?v=2"></script></body></html>
